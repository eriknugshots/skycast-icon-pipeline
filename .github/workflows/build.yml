name: build
on:
  schedule:
    # Backstop only: tick.yml starts builds as DWD runs land. GitHub honoured
    # the old "*/10" only every 3-6 h. Each tick exits in seconds if current.
    - cron: "41 3,9,15,21 * * *"
  push:
    branches: [main]
    paths: ["run_build.py", "pipeline/**", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      steps:
        description: "comma list of forecast hours (testing; skips the early exit and the state save)"
        required: false
      squares:
        description: "comma list of square names (testing)"
        required: false
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: "latest" moves to a new Ubuntu under the build
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: install cdo (conda-forge via micromamba — no apt package worth having)
        run: |
          wget -qO mm https://micro.mamba.pm/api/micromamba/linux-64/latest
          tar -xj -f mm bin/micromamba
          ./bin/micromamba create -y -q -p /tmp/cdo -c conda-forge cdo
          # GITHUB_PATH only reaches LATER steps; export for this step's check too.
          echo "/tmp/cdo/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/cdo/bin:$PATH"
          command -v cdo && cdo -V 2>&1 | head -1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: fetch state (history from earlier runs; absent on the first build)
        id: state
        # A state branch that exists but cannot be fetched must not be
        # overwritten by this build's near-empty one: build without history
        # and skip "publish state" (keep=1). ls-remote exits 2 when the
        # branch is absent, anything else non-zero when GitHub did not answer.
        run: |
          set +e
          git ls-remote --exit-code --heads origin state >/dev/null 2>&1
          ls=$?
          set -e
          if [ "$ls" = "2" ]; then
            mkdir -p state
          else
            for i in 1 2 3; do git fetch --depth 1 origin state && break; sleep $((i * 10)); done
            if git rev-parse -q --verify origin/state >/dev/null; then
              git worktree add state origin/state
            else
              echo "::warning::state branch could not be fetched (ls-remote $ls) — building without history, keeping the saved state"
              mkdir -p state
              echo "keep=1" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: build
        id: build
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          PAGES_BASE="https://$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1).github.io/$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)"
          set +e
          python run_build.py --site-dir site --state-dir state --pages-base "$PAGES_BASE" \
            ${{ inputs.steps && format('--steps {0}', inputs.steps) || '' }} \
            ${{ inputs.squares && format('--squares {0}', inputs.squares) || '' }}
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "3" ]; then echo "nothing to do"; elif [ "$rc" != "0" ]; then exit "$rc"; fi
          du -sh site 2>/dev/null || true
          du -sh blob 2>/dev/null || true
          du -sh state 2>/dev/null || true
      - name: publish site (orphan force-push to gh-pages)
        if: steps.build.outputs.rc == '0'
        # Pages serves only builds older than the Blob feed: its failure must
        # never skip the Blob publish or the state below.
        continue-on-error: true
        run: |
          cd site
          git init -b gh-pages -q
          git -c user.name=pipeline -c user.email=pipeline@users.noreply.github.com add -A
          git -c user.name=pipeline -c user.email=pipeline@users.noreply.github.com commit -q -m "run $(date -u +%Y%m%dT%H%MZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        if: steps.build.outputs.rc == '0' && !inputs.steps && !inputs.squares
        with: { node-version: "22" }
      # site/ and then blob/ (the Blob-only families: blocks, thickness and the
      # column feed, plus the manifest that names them — never on Pages, never in
      # its 1 GB budget; blob/manifest.json is site's plus those keys).
      - name: publish to Vercel Blob (the app's feed; Pages above stays for older builds) — full builds only
        if: steps.build.outputs.rc == '0' && !inputs.steps && !inputs.squares
        continue-on-error: true
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          cd publish
          npm ci --no-audit --no-fund
          node --test
          node blob.mjs ../site ../blob
      - name: publish state (orphan force-push to state) — full builds only
        if: steps.build.outputs.rc == '0' && !inputs.steps && steps.state.outputs.keep != '1'
        run: |
          cd state
          rm -rf .git
          git init -b state -q
          git -c user.name=pipeline -c user.email=pipeline@users.noreply.github.com add -A
          git -c user.name=pipeline -c user.email=pipeline@users.noreply.github.com commit -q -m "state $(date -u +%Y%m%dT%H%MZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
