name: ifs
# IFS Direct: our own worldwide cloud-cover and thickness feed from ECMWF's IFS
# open data (00/12Z oper runs; 06/18Z are the short scda stream and are not
# built). Like tick.yml, one run watches for 5 hours and then starts the next (a
# workflow may dispatch workflows with its own token). Runs are 12 h apart; the
# loop checks every 10 minutes. A build runs inline, up to 45 minutes.
# Publishes to its own Vercel Blob store (IFS_BASE), never another feed's.
# The build's history lives on the orphan branch state-ifs (fetched into state/
# before the loop, force-pushed after each successful publish).
# Until IFS_BASE and the IFS_BLOB_READ_WRITE_TOKEN secret exist, runs start only
# by hand: the schedule goes back (cron "41 */4 * * *") when the store exists.
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: ifs
  cancel-in-progress: false
env:
  IFS_BASE: https://IFS-BLOB-STORE-ID.public.blob.vercel-storage.com   # PLACEHOLDER: public URL of the new store, filled in before the first run
jobs:
  ifs:
    runs-on: ubuntu-24.04   # pinned: "latest" moves to a new Ubuntu under the build
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd publish && npm ci --no-audit --no-fund && node --test
      - name: fetch state (history from earlier runs; absent on the first build)
        id: state
        # A state branch that exists but cannot be fetched must not be
        # overwritten by a near-empty one: build without history and skip the
        # state push (keep=1). ls-remote exits 2 when the branch is absent (the
        # first push creates it), anything else non-zero when GitHub did not answer.
        run: |
          set +e
          git ls-remote --exit-code --heads origin state-ifs >/dev/null 2>&1
          ls=$?
          set -e
          if [ "$ls" = "2" ]; then
            mkdir -p state
          else
            for i in 1 2 3; do git fetch --depth 1 origin state-ifs && break; sleep $((i * 10)); done
            if git rev-parse -q --verify origin/state-ifs >/dev/null; then
              git worktree add state origin/state-ifs
            else
              echo "::warning::state-ifs could not be fetched (ls-remote $ls) — building without history, keeping the saved state"
              mkdir -p state
              echo "keep=1" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: watch IFS, build each new run
        id: loop
        env:
          PYTHONUNBUFFERED: "1"
          BLOB_READ_WRITE_TOKEN: ${{ secrets.IFS_BLOB_READ_WRITE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_KEEP: ${{ steps.state.outputs.keep }}
        run: |
          end=$(( $(date +%s) + 5 * 3600 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            # ifs_build.py: 0 built, 3 nothing new, anything else failed. A
            # failure (or a build killed by the 45 min timeout, exit 124/137) is
            # retried on the next pass, so it must not end the loop. A failed
            # build may leave a partial site-ifs: only exit 0 publishes it.
            set +e
            timeout -k 10 2700 python ifs_build.py --out site-ifs --state state --live-manifest "$IFS_BASE/manifest.json"
            rc=$?
            set -e
            if [ "$rc" = "0" ]; then
              # A failed publish is retried by the next pass (the live manifest
              # still names the old run), so it too must not end the loop, and
              # the state is pushed only after a publish that worked.
              if (cd publish && node blob.mjs ../site-ifs); then
                if [ "$STATE_KEEP" != "1" ]; then
                  (
                    cd state || exit 1
                    rm -rf .git
                    git init -b state-ifs -q
                    git -c user.name=pipeline -c user.email=pipeline@users.noreply.github.com add -A
                    git -c user.name=pipeline -c user.email=pipeline@users.noreply.github.com commit -q -m "state $(date -u +%Y%m%dT%H%MZ)"
                    git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state-ifs
                  ) || echo "state push failed, will retry"
                fi
              else
                echo "publish failed, will retry"
              fi
              rm -rf site-ifs
            elif [ "$rc" != "3" ]; then
              echo "ifs_build.py failed (exit $rc), retrying next pass"
              rm -rf site-ifs
            fi
            sleep 600
          done
      - name: start the next run
        # Not after a broken setup step (pip, pytest, npm, node --test): that
        # would restart a failing run at once; the 4-hourly cron (once restored)
        # restarts it.
        if: always() && steps.loop.conclusion != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ifs.yml --ref main
