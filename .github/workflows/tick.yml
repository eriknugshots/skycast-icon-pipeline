name: tick
# Keeps the feed fresh without relying on GitHub's schedule, which fired
# build.yml's "*/10" only every 3-6 hours (2026-09-27/28) and let the live run
# age past the app's 12 h limit, so "DWD ICON · Direct" fell back to
# Open-Meteo. One tick watches DWD every 10 minutes for 5 hours, starts a
# build the moment a new complete run is listed, then starts the next tick
# (a workflow may dispatch workflows with its own token). The schedule
# below only restarts the chain if it ever breaks.
# Each wake also checks the SkyCast alerts server on Vercel and emails Erik
# when it goes down or recovers (alerts_watchdog.py; secret RESEND_ALERTS_KEY,
# set by tools/watchdog-key-setup.sh). GitHub does not share Vercel's fate.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: watch DWD, build on a new run
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_ALERTS_KEY: ${{ secrets.RESEND_ALERTS_KEY }}
        run: |
          PAGES_BASE="https://$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1).github.io/$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)"
          end=$(( $(date +%s) + 5 * 3600 ))
          # Watchdog for the SkyCast alerts server (alerts_watchdog.py), once
          # per wake: in the background, killed after 60 s, its exit status
          # ignored, so it cannot fail, stop or delay this loop. Its state is
          # a file in this job's temp dir, fresh for every tick.
          wd_state="${RUNNER_TEMP:-/tmp}/alerts-watchdog.json"
          rm -f "$wd_state" || true
          wd_tiles_state="${RUNNER_TEMP:-/tmp}/tiles-watchdog.json"
          rm -f "$wd_tiles_state" || true
          wd_pid=""
          while [ "$(date +%s)" -lt "$end" ]; do
            if [ -n "$wd_pid" ]; then wait "$wd_pid" 2>/dev/null || true; fi
            ( timeout -k 5 55 python alerts_watchdog.py --state-file "$wd_state" || echo "watchdog: gave up (exit $?), tick unaffected" ) &
            ( timeout -k 5 55 python alerts_watchdog.py --state-file "$wd_tiles_state" --health-url https://sunset-prediction.vercel.app/api/tiles-health --name "tile keys" --fields ok,newestKeyAgeH,lastRunAgeH,lastErrorKind --absent-ok || echo "watchdog: gave up (exit $?), tick unaffected" ) &
            wd_pid=$!
            set +e
            python tick.py --pages-base "$PAGES_BASE"
            rc=$?
            set -e
            if [ "$rc" = "0" ]; then
              gh workflow run build.yml --ref main
              # A build takes ~20 min (~7 for the clouds, ~13 for the
              # column feed) and Pages ~1.5 more; don't ask again until the
              # new manifest can be live. A tick that asks early anyway only
              # queues a build that exits early.
              sleep 1800
            else
              sleep 600
            fi
          done
      - name: start the next tick
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tick.yml --ref main
